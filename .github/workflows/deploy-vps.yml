name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      feed_sync:
        description: "Set true when triggered purely by Perfluence catalog feed sync"
        type: boolean
        default: false
        required: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Pre-Deploy Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Feed & Runtime Safety Gates
        run: |
          npm run test:perfluence-affiliate-safety
          npm run test:runtime-perfluence
          npm run test:article-cover
          npm run test:trust
          npm run test:reliability
          npm run test:geo-indexing
          npm run test:store-display-name
          node scripts/test-indexnow-push.mjs
          node --loader ./scripts/ts-loader.mjs scripts/test-internal-graph.mjs

      - name: Unit & Regression Tests
        if: ${{ inputs.feed_sync != true && inputs.feed_sync != 'true' }}
        run: npm test

      - name: Build Verification
        env:
          E2E_FIXTURES: "true"
        run: npm run build

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Секрет, которым GitHub-задачи (радар Perfluence, проверка купонов, постинг) стучатся в API сайта.
      # На Vercel он был в настройках проекта; на VPS его не было, и эти задачи получали 401.
      # Next.js читает .env.production.local при сборке и запуске, но переменные из systemd
      # (/etc/promofact.env) имеют приоритет, а там старое значение. Поэтому отдельное имя,
      # которое API принимает наравне с TELEGRAM_POSTING_SECRET.
      - name: Sync API secret to the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          TELEGRAM_POSTING_SECRET: ${{ secrets.TELEGRAM_POSTING_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PERFLUENCE_SESSION_B64: ${{ secrets.PERFLUENCE_SESSION_B64 }}
          TELEGRAM_PUBLIC_BOT_TOKEN: ${{ secrets.TELEGRAM_PUBLIC_BOT_TOKEN }}
          TELEGRAM_BOT_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_BOT_WEBHOOK_SECRET }}
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
        run: |
          [ -n "$TELEGRAM_POSTING_SECRET" ] || { echo "TELEGRAM_POSTING_SECRET not set, skipping"; exit 0; }
          {
            printf 'TELEGRAM_POSTING_SECRET_DEPLOYED=%s\n' "$(printf '%s' "$TELEGRAM_POSTING_SECRET" | tr -d '\r\n')"
            [ -z "$TELEGRAM_BOT_TOKEN" ] || printf 'TELEGRAM_BOT_TOKEN_DEPLOYED=%s\n' "$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '\r\n')"
            # Сессия кабинета Perfluence для радара уведомлений (/api/perfluence-live/check).
            [ -z "$PERFLUENCE_SESSION_B64" ] || printf 'PERFLUENCE_SESSION_B64_DEPLOYED=%s\n' "$(printf '%s' "$PERFLUENCE_SESSION_B64" | tr -d '\r\n')"
            [ -z "$TELEGRAM_PUBLIC_BOT_TOKEN" ] || printf 'TELEGRAM_PUBLIC_BOT_TOKEN=%s\n' "$(printf '%s' "$TELEGRAM_PUBLIC_BOT_TOKEN" | tr -d '\r\n')"
            [ -z "$TELEGRAM_BOT_WEBHOOK_SECRET" ] || printf 'TELEGRAM_BOT_WEBHOOK_SECRET=%s\n' "$(printf '%s' "$TELEGRAM_BOT_WEBHOOK_SECRET" | tr -d '\r\n')"
            [ -z "$NEXT_PUBLIC_TELEGRAM_BOT_USERNAME" ] || printf 'NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=%s\n' "$(printf '%s' "$NEXT_PUBLIC_TELEGRAM_BOT_USERNAME" | tr -d '\r\n')"
          } | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes app@"$VPS_HOST" \
                'umask 077; cat > /srv/promofact/.env.production.local'

      - name: Build and restart on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes app@"$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /srv/promofact
          git fetch --depth 1 origin main
          git reset --hard origin/main
          set -a
          . /etc/promofact.env
          [ -f /srv/promofact/.env.production.local ] && . /srv/promofact/.env.production.local
          set +a
          npm ci --include=dev --no-audit --no-fund
          NODE_OPTIONS=--max-old-space-size=1536 npm run build
          sudo /bin/systemctl restart promofact
          sleep 5
          curl -fsS -o /dev/null -H "Host: promofact.ru" -H "X-Forwarded-Proto: https" http://127.0.0.1:3000/
          curl -fsS -H "Host: promofact.ru" -H "X-Forwarded-Proto: https" http://127.0.0.1:3000/api/telegram/bot
          echo ""
          if [ -n "${TELEGRAM_BOT_TOKEN_DEPLOYED:-}" ] || [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || [ -n "${TELEGRAM_PUBLIC_BOT_TOKEN:-}" ]; then
            node scripts/setup-telegram-bot.mjs --apply
          fi
          echo "deployed $(git rev-parse --short HEAD)"
          REMOTE
