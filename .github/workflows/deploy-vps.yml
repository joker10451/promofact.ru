name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build and restart on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes app@"$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /srv/promofact
          git fetch --depth 1 origin main
          git reset --hard origin/main
          set -a; . /etc/promofact.env; set +a
          npm ci --include=dev --no-audit --no-fund
          NODE_OPTIONS=--max-old-space-size=1536 npm run build
          sudo /bin/systemctl restart promofact
          sleep 5
          curl -fsS -o /dev/null -H "Host: promofact.ru" -H "X-Forwarded-Proto: https" http://127.0.0.1:3000/
          echo "deployed $(git rev-parse --short HEAD)"
          REMOTE
