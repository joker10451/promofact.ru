name: Admitad Safe Snapshot Sync (Autopilot)

on:
  workflow_dispatch: # Ручной запуск через Actions UI
    inputs:
      approved_campaigns:
        description: "Comma-separated Admitad campaign IDs to publish (e.g. 45863 for PREMIER pilot). REQUIRED — empty value blocks sync."
        required: true
      production_allowlist_confirmed:
        description: "Confirm all existing production approvals are preserved; when enabling Befree, check its scoped production flag too."
        type: boolean
        default: false
        required: true
      befree_pilot:
        description: "Publish ONLY verified Befree coupon 942686 through scoped pilot, after enabling the production flag."
        type: boolean
        default: false
        required: true

  # SCHEDULE CONFIGURED (каждые 3 часа UTC: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC).
  # По требованию ТЗ: сконфигурирован, но отключен до явного подтверждения (enabled only after manual approval).
  # schedule:
  #   - cron: "0 */3 * * *"

# Prevent legacy manual sync and automated verified-batch sync from running
# concurrently against the same authoritative Supabase snapshot.
concurrency:
  group: admitad-publisher
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail-closed campaign allowlist preflight (read-only)
        env:
          ADMITAD_APPROVED_CAMPAIGNS: ${{ github.event.inputs.approved_campaigns || vars.ADMITAD_APPROVED_CAMPAIGNS || '' }}
          PRODUCTION_ALLOWLIST_PARITY_CONFIRMED: ${{ inputs.production_allowlist_confirmed }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --loader ./scripts/ts-loader.mjs scripts/check-admitad-sync-preflight.mjs

      - name: Run Admitad Safe Sync
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
          ADMITAD_WEBSITE_HOST: "promofact.ru"
          ADMITAD_APPROVED_CAMPAIGNS: ${{ github.event.inputs.approved_campaigns || vars.ADMITAD_APPROVED_CAMPAIGNS || '' }}
          ADMITAD_BEFREE_PILOT_ENABLED: ${{ inputs.befree_pilot }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node --loader ./scripts/ts-loader.mjs scripts/sync-admitad-snapshot.mjs
