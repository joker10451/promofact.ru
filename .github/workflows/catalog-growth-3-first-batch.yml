name: CATALOG-GROWTH-3 First Batch (one-shot)

on:
  push:
    branches: [ops/catalog-growth-3-first-batch]
    paths:
      - .github/workflows/catalog-growth-3-first-batch.yml

permissions:
  contents: read

concurrency:
  group: admitad-publisher
  cancel-in-progress: false

jobs:
  first-reviewed-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify and publish strictly verified three-program batch
        env:
          ADMITAD_BATCH_MODE: initial
          ADMITAD_BATCH_RUN_APPROVED: 'true'
          ADMITAD_BATCH_APPROVED_CAMPAIGNS: '28532,14647,22484'
          ADMITAD_APPROVED_CAMPAIGNS: '141770,1667,17220,25224,26110'
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
          ADMITAD_WEBSITE_HOST: promofact.ru
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --loader ./scripts/ts-loader.mjs scripts/admitad-batch-sync.mjs
