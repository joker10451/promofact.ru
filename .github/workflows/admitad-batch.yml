name: Admitad Verified Program Batch Sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "initial: extend 27-offer baseline; recurring: refresh existing verified programs"
        required: true
        type: choice
        options: [initial, recurring]
        default: recurring
      batch:
        description: "existing-three for normal refresh; expand-five only for first 5-program reviewed release"
        type: choice
        required: true
        options: [existing-three, expand-five]
        default: existing-three
      preview_only:
        description: "What-if ONLY: compare 5 shortlisted coupons; NEVER write to Supabase"
        type: boolean
        required: true
        default: false
      confirm:
        description: "I authorize this reviewed program list (new five only in INITIAL mode)"
        type: boolean
        required: true
        default: false
  # Auto-refresh only verified programs; set repo Actions variable
  # ADMITAD_BATCH_AUTO_SYNC_ENABLED=false to stop without a code change.
  schedule:
    # Keep approved off-hour cadence from PR #77.
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: admitad-publisher
  cancel-in-progress: false

jobs:
  publish-verified-batch:
    if: ${{ (github.event_name == 'schedule' && vars.ADMITAD_BATCH_AUTO_SYNC_ENABLED != 'false') || (github.event_name == 'workflow_dispatch' && inputs.confirm == true && ((inputs.batch == 'expand-five' && inputs.mode == 'initial') || (inputs.batch == 'existing-three' && inputs.mode == 'recurring')) && (!inputs.preview_only || (inputs.batch == 'expand-five' && inputs.mode == 'initial'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Safe batch preview and atomic publish
        env:
          ADMITAD_BATCH_MODE: ${{ github.event_name == 'schedule' && 'recurring' || inputs.mode }}
          ADMITAD_BATCH_RUN_APPROVED: 'true'
          ADMITAD_BATCH_PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only && 'true' || 'false' }}
          # Empty by default. Publisher must explicitly review coupon IDs before first 5-brand release.
          ADMITAD_BATCH_REVIEWED_COUPON_IDS: ${{ vars.ADMITAD_BATCH_REVIEWED_COUPON_IDS }}
          ADMITAD_BATCH_APPROVED_CAMPAIGNS: ${{ github.event_name == 'workflow_dispatch' && inputs.batch == 'expand-five' && '28532,14647,22484,93978,11738,26032,14725,23485' || '28532,14647,22484' }}
          ADMITAD_APPROVED_CAMPAIGNS: '141770,1667,17220,25224,26110'
          # Keep previously published site-scoped smart/personal coupons active on scheduled refresh.
          # Restricted to recurring existing-three; INITIAL reviewed-five still uses old fail-closed gate.
          # New additions outside the three verified recurring programs remain blocked by onlyNewCampaignIds.
          ADMITAD_PUBLISH_WEBSITE_COUPONS: ${{ (github.event_name == 'schedule' || (inputs.mode == 'recurring' && inputs.batch == 'existing-three')) && 'true' || 'false' }}
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
          ADMITAD_WEBSITE_HOST: promofact.ru
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --loader ./scripts/ts-loader.mjs scripts/admitad-batch-sync.mjs
