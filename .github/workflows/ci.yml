name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required to diff the previous main commit for new article notifications.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Security gate: production libraries must not have high/critical advisories.
      # Dev-only ESLint advisories are reported separately; never run audit --force.
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit & Regression Tests
        run: npm test

      - name: Security, posting reliability and geo indexing
        run: |
          npm run test:trust
          npm run test:reliability
          npm run test:geo-indexing
          node scripts/test-indexnow-push.mjs

      # В CI нет ключей Perfluence — Next.js использует DEV-моки (см. perfluence.ts).
      # Этот шаг гарантирует, что код компилируется и все страницы (вкл. SSG
      # /store, /category) успешно пререндерятся на мок-данных.
      - name: Build
        env:
          E2E_FIXTURES: "true"
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-End Scenarios (Playwright)
        env:
          E2E_FIXTURES: "true"
        run: npm run test:e2e

      # Real production QA: READ-ONLY. This checks current public pages rather
      # than only the dev fixture server and never follows affiliate links.
      # External network problems are reported but do not break code CI.
      - name: Live production store pages and mobile QA
        continue-on-error: true
        run: node scripts/audit-production-pages.mjs

      - name: Upload live QA screenshots (PR only)
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: promofact-live-store-mobile
          path: audit-screenshots/live/*.png
          if-no-files-found: warn
          retention-days: 3

      # The screenshots are generated locally during Playwright (no Vercel
      # Preview deployments). Download these from the pull request's CI run.
      - name: Upload mobile UI audit screenshots (PR only)
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: promofact-polish-mobile
          path: audit-screenshots/after/polish-*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Dynamic SEO & Inventory Audit
        run: npm run test:seo

      - name: Lint
        run: npm run lint

      # Примечание: `npm run build:check` (fail, если 0 SEO-страниц) НЕ запускаем
      # в CI — он валиден только в прод-окружении Vercel, где задан
      # PERFLUENCE_WIDGET_URL. Там он уже срабатывает как прод-гейт.

      # IndexNow delivery is external infrastructure, not a code/build test.
      # Public key verification replaces missing GitHub bearer-token secrets.
      - name: IndexNow push new articles (instant)
        id: indexnow_new
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: node scripts/indexnow-new.mjs ${{ github.event.before }} ${{ github.sha }}

      - name: IndexNow push all (main only)
        id: indexnow_all
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 60
          node scripts/indexnow-push.mjs https://promofact.ru

      - name: IndexNow delivery status
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          NEW_OUTCOME: ${{ steps.indexnow_new.outcome }}
          FULL_OUTCOME: ${{ steps.indexnow_all.outcome }}
        run: |
          if [ "$NEW_OUTCOME" = "failure" ]; then
            echo "::warning::Targeted IndexNow notification failed; inspect the preceding step."
            echo "⚠️ Targeted IndexNow failed; article URLs may need resubmission." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FULL_OUTCOME" = "success" ]; then
            echo "✅ Full-sitemap IndexNow accepted by at least one provider per batch (indexation not guaranteed)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Full-sitemap IndexNow delivery failed; inspect the preceding step."
            echo "⚠️ Full-sitemap IndexNow failed; code and SEO tests remain independent." >> "$GITHUB_STEP_SUMMARY"
          fi
