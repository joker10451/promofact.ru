
name: Admitad Publisher Website Coupon Catalog
on:
  # Same-repository PR only: automatic READ-ONLY preview with connected secrets.
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/admitadPublisherCatalog.ts'
      - 'src/lib/admitadSyncWorker.ts'
      - '.github/workflows/admitad-publisher-catalog.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (no database writes), or publish approved publisher-scoped coupons"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - publish
      confirm:
        description: "I authorize publishing coupons issued to my Admitad website"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: admitad-publisher
  cancel-in-progress: false
jobs:
  publisher-coupon-sync:
    if: ${{ github.event_name == 'pull_request' || inputs.mode == 'preview' || inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preview or atomically publish current website-scoped coupons
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
          ADMITAD_WEBSITE_HOST: promofact.ru
          ADMITAD_APPROVED_CAMPAIGNS: '141770,1667,17220,25224,26110'
          ADMITAD_BATCH_APPROVED_CAMPAIGNS: '28532,14647,22484'
          ADMITAD_PUBLISH_WEBSITE_COUPONS: 'true'
          ADMITAD_PUBLISHER_CATALOG_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || (inputs.mode == 'publish' && 'false' || 'true') }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --loader ./scripts/ts-loader.mjs scripts/sync-admitad-snapshot.mjs
