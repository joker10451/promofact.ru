name: Admitad Publisher Website Coupon Catalog

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/catalog-1-guards.mjs'
      - 'scripts/catalog-1-refresh.mjs'
      - 'scripts/test-catalog-1-refresh.mjs'
      - 'src/lib/admitadSyncWorker.ts'
      - '.github/workflows/admitad-publisher-catalog.yml'
  # One daily publisher-scope refresh; data-only writes (no Git push/deploy).
  # Disable immediately with Actions variable ADMITAD_PUBLISHER_AUTO_SYNC_ENABLED=false.
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "preview: read-only; publish: explicitly approved atomic refresh"
        type: choice
        required: true
        default: preview
        options: [preview, publish]
      confirm:
        description: "I authorize the current existing-program catalog refresh (publish only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: admitad-publisher
  cancel-in-progress: false

jobs:
  publisher-coupon-sync:
    # PRs always preview. Only daily schedule on main or confirmed manual publish may write.
    # A repo Actions variable provides immediate stop without another deployment.
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'schedule' && vars.ADMITAD_PUBLISHER_AUTO_SYNC_ENABLED != 'false') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'preview' || inputs.confirm == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test CATALOG-1 safety and authorization
        run: node scripts/test-catalog-1-refresh.mjs
      - name: Preview and atomic publish only for enabled schedule or confirmed manual run
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
          ADMITAD_WEBSITE_HOST: promofact.ru
          ADMITAD_APPROVED_CAMPAIGNS: '141770,1667,17220,25224,26110'
          ADMITAD_BATCH_APPROVED_CAMPAIGNS: '28532,14647,22484'
          ADMITAD_PUBLISH_WEBSITE_COUPONS: 'true'
          ADMITAD_PUBLISHER_CATALOG_DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && inputs.confirm == true)) && 'false' || 'true' }}
          ADMITAD_CATALOG_PUBLISH_APPROVED: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && inputs.confirm == true)) && 'true' || 'false' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --loader ./scripts/ts-loader.mjs scripts/catalog-1-refresh.mjs
