name: Admitad Catalog Eligibility Audit (Read Only)

on:
  # One-time, tightly scoped review branch. No production publishing.
  push:
    branches: [catalog/live-audit-20261012]
    paths:
      - 'scripts/audit-admitad-catalog.mjs'
      - '.github/workflows/admitad-catalog-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify publisher program eligibility (no writes)
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
          ADMITAD_WEBSITE_HOST: promofact.ru
        run: node --loader ./scripts/ts-loader.mjs scripts/audit-admitad-catalog.mjs
