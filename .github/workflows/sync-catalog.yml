name: Safe Catalog Sync & PR

on:
  schedule:
    - cron: '0 6 * * *' # Раз в сутки в 09:00 МСК (06:00 UTC)
  workflow_dispatch: # Возможность запустить вручную

concurrency:
  group: sync-catalog
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Feed & Create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync partner catalog
        env:
          PERFLUENCE_WIDGET_URL: ${{ secrets.PERFLUENCE_WIDGET_URL }}
        run: node scripts/sync-catalog.mjs

      - name: Run verification tests
        run: |
          npm test
          npm run test:seo

      - name: Check for feed changes
        id: git_check
        run: |
          if git diff --quiet src/data/perfluence-feed.json src/data/sync-meta.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Изменений в фиде не обнаружено."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Обнаружены обновленные предложения."
          fi

      - name: Create Pull Request with updated catalog
        if: steps.git_check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(catalog): регулярное обновление фида предложений"
          title: "chore(catalog): обновление каталога партнерских предложений"
          body: |
            Автоматическое обновление фида предложений PromoFact:
            - Запущен `scripts/sync-catalog.mjs`
            - Пройдены `npm test` и `npm run test:seo`
            - Защита от обнуления и сжатия каталога проверена.

            ⚠️ **Внимание:** автоматическое слияние и деплой отключены. Проверьте изменения и выполните merge вручную при готовности к релизу.
          branch: chore/catalog-feed-update
          base: main
          delete-branch: true
