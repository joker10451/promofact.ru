name: Safe Catalog Sync & Auto-Deploy

on:
  schedule:
    # 4 раза в сутки: 00:05, 06:05, 12:05, 18:05 МСК (21:05, 03:05, 09:05, 15:05 UTC)
    - cron: '5 21,3,9,15 * * *'
  workflow_dispatch: # Возможность запустить вручную

concurrency:
  group: sync-catalog
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Feed & Auto-Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # 1. npm ci
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # 2. Синхронизация каталога
      - name: Sync partner catalog
        id: sync_catalog
        env:
          PERFLUENCE_WIDGET_URL: ${{ secrets.PERFLUENCE_WIDGET_URL }}
        run: node scripts/sync-catalog.mjs

      # 3. Проверка результата синхронизации (success vs fallback/failed)
      - name: Verify sync status
        id: verify_sync
        run: node scripts/verify-sync-status.mjs

      # 4. npm test
      - name: Run unit & regression tests (npm test)
        run: npm test

      # 5. npm run lint
      - name: Run linter (npm run lint)
        run: npm run lint

      # 6. npm run build
      - name: Build Next.js application (npm run build)
        run: npm run build

      # 7. npm run test:seo
      - name: Dynamic SEO & Inventory Audit (npm run test:seo)
        run: npm run test:seo

      # 8. Проверка содержательных изменений фида (исключая технические timestamps)
      - name: Check substantive feed changes
        id: check_changes
        run: node scripts/check-feed-changes.mjs

      # 9. Автоматический коммит и пуш в main при наличии подтвержденных изменений каталога
      - name: Commit and push changes directly to main
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/perfluence-feed.json src/data/sync-meta.json
          git commit -m "chore(catalog): регулярное автообновление каталога партнерских предложений"
          git push origin main

