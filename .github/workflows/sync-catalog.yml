name: Perfluence Feed Auto-Sync & Deploy

on:
  # Every 6 hours. A commit (and Vercel deploy) happens only when the feed
  # changed substantively (check-feed-changes), so quiet runs cost nothing.
  schedule:
    - cron: '5 1,7,13,19 * * *'
  workflow_dispatch: # Возможность запустить вручную

concurrency:
  group: sync-catalog
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Feed & Auto-Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # 1. npm ci
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # 2. Восстановление сессии Perfluence (если задан секрет)
      - name: Restore Perfluence session
        env:
          PERFLUENCE_SESSION_B64: ${{ secrets.PERFLUENCE_SESSION_B64 }}
        run: |
          mkdir -p data
          if [ -n "$PERFLUENCE_SESSION_B64" ]; then
            echo "$PERFLUENCE_SESSION_B64" | base64 -d > data/perfluence_session.json
            chmod 600 data/perfluence_session.json
            echo "✓ Perfluence session restored for authorized publication details"
          else
            echo "ℹ️ PERFLUENCE_SESSION_B64 not configured; exact expiry enrichment unavailable"
          fi

      # 3. Синхронизация каталога
      - name: Sync partner catalog
        id: sync_catalog
        env:
          PERFLUENCE_WIDGET_URL: ${{ secrets.PERFLUENCE_WIDGET_URL }}
          PERFLUENCE_SESSION_B64: ${{ secrets.PERFLUENCE_SESSION_B64 }}
        run: node scripts/sync-catalog.mjs

      # 3b. Earnings order for byScore (ids/codes only; the repo is public).
      - name: Sync earnings rank
        id: earnings
        env:
          PERFLUENCE_RESULTS_URL: ${{ secrets.PERFLUENCE_RESULTS_URL }}
        run: |
          node scripts/sync-earnings-rank.mjs
          if git diff --quiet -- src/data/earnings-rank.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 4. Проверка результата синхронизации (success vs fallback/failed)
      - name: Verify sync status
        id: verify_sync
        run: node scripts/verify-sync-status.mjs

      # 5. Only feed-relevant tests: this job changes data, not code (code on
      # main is already gated by CI). Date-bound campaign tests once blocked
      # the feed for three weeks, so they must not gate it again.
      - name: Feed safety tests
        run: |
          npm run test:normalizer
          npm run test:expiry
          npm run test:trust
          npm run test:perfluence-affiliate-safety
          npm run test:runtime-perfluence
          npm run test:visitor-freshness
          npm run test:links

      # 6. npm run lint
      - name: Run linter (npm run lint)
        run: npm run lint

      # 7. npm run build
      - name: Build Next.js application (npm run build)
        run: npm run build

      # 8. npm run test:seo
      - name: Dynamic SEO & Inventory Audit (npm run test:seo)
        run: npm run test:seo

      # 9. Проверка содержательных изменений фида (исключая технические timestamps)
      - name: Check substantive feed changes
        id: check_changes
        run: node scripts/check-feed-changes.mjs

      # 10. Безопасная очистка файла сессии при любом исходе
      - name: Cleanup Perfluence session
        if: always()
        run: |
          rm -f data/perfluence_session.json
          echo "✓ Perfluence session cleaned up"

      # 11. Автоматический коммит и пуш в main при наличии подтвержденных изменений каталога
      - name: Commit and push changes directly to main
        if: success() && (steps.check_changes.outputs.has_changes == 'true' || steps.earnings.outputs.changed == 'true')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/perfluence-feed.json src/data/sync-meta.json src/data/earnings-rank.json
          git commit -m "chore(catalog): регулярное автообновление каталога партнерских предложений"
          git push origin main

      # One persistent issue instead of silent failures; closed on next success.
      - name: Report feed sync status
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const title = '[Фид Perfluence] Автосинхронизация не прошла';
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = open.find(i => !i.pull_request && i.title === title);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            if (process.env.JOB_STATUS !== 'success') {
              const body = 'Сайт продолжает показывать прошлый фид. Неудачный запуск: ' + runUrl +
                '\n\nЧастые причины: истёк PERFLUENCE_SESSION_B64, недоступен виджет, упал тест безопасности фида.';
              if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ owner, repo, title, body });
            } else if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number,
                state: 'closed', state_reason: 'completed', body: 'Синхронизация снова работает: ' + runUrl });
            }

