name: Auto Post to Telegram (Dzen Crosspost)

on:
  schedule:
    - cron: '0 7 * * *'   # 10:00 МСК (утренний пост: еда/доставка)
    - cron: '30 15 * * *' # 18:30 МСК (вечерний пост: шопинг/услуги)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of posts'
        required: false
        default: '1'
      store:
        description: 'Store slug (optional)'
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Telegram Posting API
        run: |
          LIMIT="${{ github.event.inputs.limit || '1' }}"
          STORE="${{ github.event.inputs.store || '' }}"
          
          URL="https://promofact.ru/api/telegram/post?hitOnly=true&limit=$LIMIT"
          if [ -n "$STORE" ]; then
            URL="$URL&store=$STORE"
          fi
          
          echo "Sending request to $URL"
          
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.TELEGRAM_POSTING_SECRET }}")
          
          cat response.json
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::API request failed with status $HTTP_STATUS"
            exit 1
          fi
