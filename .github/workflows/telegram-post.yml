name: Auto Post to Telegram (@smart_zakupka)

on:
  schedule:
    - cron: '30 7,15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (test without sending)'
        type: boolean
        default: false
      store:
        description: 'Slug магазина (опционально, например pyaterochka, kinopoisk)'
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Telegram Posting API
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          STORE="${{ github.event.inputs.store || '' }}"
          
          URL="https://promofact.ru/api/telegram/post"
          PARAMS=""
          
          if [ "$DRY_RUN" = "true" ]; then
            PARAMS="${PARAMS}dryRun=true&"
          fi
          
          if [ -n "$STORE" ]; then
            PARAMS="${PARAMS}store=${STORE}&"
          fi
          
          # Remove trailing ? or &
          PARAMS="${PARAMS%&}"
          PARAMS="${PARAMS%\?}"
          
          TARGET_URL="${URL}${PARAMS}"
          echo "Sending request to $TARGET_URL (dry_run=$DRY_RUN, store=$STORE)"
          
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST "$TARGET_URL" \
            -H "Authorization: Bearer ${{ secrets.TELEGRAM_POSTING_SECRET }}")
          
          echo "Response HTTP Status: $HTTP_STATUS"
          cat response.json
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::API request failed with status $HTTP_STATUS"
            exit 1
          fi