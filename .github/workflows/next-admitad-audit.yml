name: Next Admitad Program Audit (Read Only)

on:
  push:
    branches: [main]
    paths:
      - scripts/audit-next-admitad-batch.mjs
      - .github/workflows/next-admitad-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admitad-readonly-program-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit connected publisher program candidates
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
          ADMITAD_WEBSITE_HOST: promofact.ru
        run: node --loader ./scripts/ts-loader.mjs scripts/audit-next-admitad-batch.mjs
