name: Perfluence & Telegram Pipeline — Автономный конвейер

on:
  schedule:
    # 3 раза в день по Московскому времени (UTC+3):
    # 10:15 МСК (07:15 UTC) — утренний просмотр, начало рабочего дня
    # 14:15 МСК (11:15 UTC) — обеденный перерыв, заказ еды и рестораны
    # 18:45 МСК (15:45 UTC) — вечер, шопинг, онлайн-кинотеатры и досуг
    - cron: '15 7,11,15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Тестовый прогон (без отправки в канал)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  run-autonomous-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Установка зависимостей
        run: npm ci

      - name: 🚀 Запуск полного автономного конвейера
        env:
          PERFLUENCE_WIDGET_URL: ${{ secrets.PERFLUENCE_WIDGET_URL }}
          PERFLUENCE_SESSION_B64: ${{ secrets.PERFLUENCE_SESSION_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '@smart_zakupka' }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID || '-240879299' }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID || '240879299' }}
        run: |
          mkdir -p data
          # Восстановление сессии Perfluence из секретов GitHub (если задана)
          if [ -n "$PERFLUENCE_SESSION_B64" ]; then
            echo "$PERFLUENCE_SESSION_B64" | base64 -d > data/perfluence_session.json
            echo "✓ Сессия Perfluence восстановлена в data/perfluence_session.json"
          fi
          
          # Запуск оркестратора
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/pipeline-orchestrator.mjs --dry-run
          else
            node scripts/pipeline-orchestrator.mjs --no-take
          fi

      - name: 💾 Сохранение истории публикаций
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_promos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(history): auto-update posted promos history [skip ci]" && git push)
